name: Build container images for a release

on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  build-container:
    name: Build container images
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            BUILD_ARCH: amd64

          - os: ubuntu-22.04-arm
            BUILD_ARCH: arm64

    steps:
      - name: Checkout etclabscore/core-geth
        uses: actions/checkout@v3

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Login GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build container images
        run: |
          go run build/ci.go docker \
            -git-commit "${GITHUB_SHA}" \
            -git-tag "${GITHUB_REF_NAME}" \
            -buildnum "${GITHUB_RUN_NUMBER}" \
            -image \
            -upload "ghcr.io/${GITHUB_REPOSITORY,,}"

  build-container-manifest:
    name: Build container manifest
    needs: build-container
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout etclabscore/core-geth
        uses: actions/checkout@v3

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Login GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build container manifest
        run: |
          go run build/ci.go docker \
            -git-commit "${GITHUB_SHA}" \
            -git-tag "${GITHUB_REF_NAME}" \
            -buildnum "${GITHUB_RUN_NUMBER}" \
            -manifest "amd64,arm64" \
            -upload "ghcr.io/${GITHUB_REPOSITORY,,}"